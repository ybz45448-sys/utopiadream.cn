spring.application.name=day23

# ============================================================
# 数据库连接（第50天改造：全部改成环境变量，带本地默认值）
#
# 本地开发：不设环境变量，用冒号后的默认值（localhost + 123456）
# 生产部署：用环境变量覆盖，例如：
#   DB_URL      = jdbc:postgresql://数据库服务器:5432/utopia
#   DB_USERNAME = utopia_app
#   DB_PASSWORD = <生产数据库密码>
#
# Spring 属性引用语法：${变量名:默认值}
# 优先级：命令行参数 > 环境变量 > 配置文件里的默认值
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/utopia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}



