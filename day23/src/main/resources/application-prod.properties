# ============================================================
# 生产环境配置（第50天新增）
#
# 激活方式：启动时设置环境变量 SPRING_PROFILES_ACTIVE=prod
#   SPRING_PROFILES_ACTIVE=prod java -jar day23.jar
#
# 生产环境原则（fail-fast）：
#   ⚠️ 所有配置都不带默认值！
#   环境变量缺失 → 启动直接报错退出
#   宁可启动失败，也不能带错配置悄悄上线
# ============================================================

# 生产数据库：必须由环境变量提供
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 生产 JWT 密钥：必须由环境变量提供
jwt.secret=${JWT_SECRET}

# 生产 CORS：线上前端地址（多个用逗号分隔）
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
